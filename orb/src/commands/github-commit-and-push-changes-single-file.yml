description: >
  This command commits and pushes a file change to a specific repo/branch.
  The file's current content is treated as authoritative: it overwrites
  whatever the target branch has (no merge is attempted). Any manual commits
  made directly to the target branch's copy of the file will be overwritten
  by the next run — such changes belong on the branch this command runs from.
parameters:
  repo:
    type: string
    default: "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME"
    description: "The repository to create the issue in"
  branch:
    type: string
    default: $CIRCLE_BRANCH
    description: "Branch where to commit to"
  file:
    type: string
    description: "File to commit"
  commit-message:
    type: string
    description: "Message to use"
    default: "Deploying to ${CIRCLE_BRANCH} from @ ${SOURCE_REPO}@${SOURCE_COMMIT} 🚀"
  commit-username:
    type: string
    description: "username to use for commit, if not specified the circleci user that triggered the event is used"
    default: ""
  commit-email:
    type: string
    description: "email to use for commit, if not specified <github-username-id>+<commit-username>@users.noreply.github.com will be used"
    default: ""
  skip-ci:
    type: boolean
    description: "Whether to skip CI checks"
    default: false
  condition:
    type: string
    default: "always"
    description: "The condition to run the command. 0 and always are considered true, everything else is false"
steps:
  - setup-circleci-utils-and-github-token
  - run:
      name: Commit and Push Changes
      command: |
        if [ "<< parameters.condition >>" != "always" ] && [ "<< parameters.condition >>" != "0" ] && [ "<< parameters.condition >>" != "true" ]; then
          echo "Skipping command because condition (<< parameters.condition >>) is not met"
          exit 0
        fi

        token=$(cat "$SECRET_ACCESS_TOKEN_FILE_PATH")

        # Store the absolute path of the target folder
        TARGET_FILE=$(realpath "<< parameters.file >>")
        TARGET_DIR=$(dirname "${TARGET_FILE}")

        # Check if the target folder is within a git repository
        if ! git -C "${TARGET_DIR}" rev-parse --git-dir > /dev/null 2>&1; then
          echo "Error: The specified file '${TARGET_FILE}' is not within a git repository."
          exit 1
        fi

        if [ -z "<< parameters.commit-username >>" ]; then
          # Get the username of the user that triggered the event
          USERNAME=${CIRCLE_USERNAME}
        else
          USERNAME="<< parameters.commit-username >>"
        fi

        if [ -z "<< parameters.commit-email >>" ]; then
          # Extract the email from the user info
          ID=$(curl "https://api.github.com/users/${USERNAME}" | jq -r '.id')
          USER_EMAIL="${ID}+${USERNAME}@users.noreply.github.com"
        else
          USER_EMAIL="<< parameters.commit-email >>"
        fi

        # Git operations with committer's identity
        git config --global user.name "${USERNAME}"
        git config --global user.email "${USER_EMAIL}"

        # Ensure we're in the git repository root
        cd "$(git rev-parse --show-toplevel)" || exit 1

        # Save the target file aside: its current content is the desired final
        # state for the target branch and is committed verbatim (overwrite
        # semantics). Do NOT merge it with whatever the target branch has —
        # the previous stash/pop approach did exactly that, and when the pop
        # conflicted (masked by `|| true`) it committed git conflict markers
        # into the file, corrupting it further on every scheduled run.
        TMP_FILE=$(mktemp)
        cp -p "${TARGET_FILE}" "${TMP_FILE}"

        # Clear the working directory so the branch switch cannot conflict.
        # Intentionally never popped: the copy saved above is the
        # authoritative content. The stash entry keeps the pre-checkout state
        # recoverable for debugging.
        git stash push -u

        SKIP_CI=""
        if [ "<< parameters.skip-ci >>" = true ]; then
          SKIP_CI="[skip ci] "
        fi

        # Retry to absorb non-fast-forward rejections when something else
        # pushes to the target branch between our fetch and our push.
        PUSH_OK=false
        for ATTEMPT in 1 2 3; do
          # Fetch all remote branches
          git fetch origin

          # Check if the branch exists remotely
          if git show-ref --verify --quiet "refs/remotes/origin/<< parameters.branch >>"; then
            echo "Branch << parameters.branch >> exists remotely, using it as base..."
            # Create/reset local branch to track the remote one
            git checkout -B "<< parameters.branch >>" "origin/<< parameters.branch >>"
          else
            echo "Creating new branch << parameters.branch >>..."
            # Create/reset branch from current HEAD if it doesn't exist remotely
            git checkout -B "<< parameters.branch >>" HEAD
          fi

          # Overwrite the target branch's version of the file with the saved copy
          mkdir -p "$(dirname "${TARGET_FILE}")"
          cp -p "${TMP_FILE}" "${TARGET_FILE}"

          # Stage only the target file
          git add "${TARGET_FILE}"

          # Create commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            PUSH_OK=true
            break
          fi

          echo "Committing changes..."
          git commit -m "${SKIP_CI}<< parameters.commit-message >>"

          if git push "https://x-access-token:${token}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" "<< parameters.branch >>"; then
            PUSH_OK=true
            break
          fi

          echo "Push attempt ${ATTEMPT} failed (target branch may have moved); retrying..."
          sleep 5
        done

        rm -f "${TMP_FILE}"

        if [ "${PUSH_OK}" != true ]; then
          echo "Error: failed to push to << parameters.branch >> after 3 attempts."
          exit 1
        fi
